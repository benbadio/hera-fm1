name: Build Firmware & Deploy Pages

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  host-test:
    name: Host Simulator & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y netpbm ffmpeg

      - name: Run Host Simulator Test Suite
        run: |
          chmod +x tests/run_host.sh
          sh -x ./tests/run_host.sh 2>&1 | tee host-test.log

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-log
          path: host-test.log

      - name: Upload Test Audio and Screenshots
        uses: actions/upload-artifact@v4
        with:
          name: host-test-artifacts
          path: |
            build/host/*.wav
            build/host/*.png

  firmware-build:
    name: Build MORPHEUS .fwsc Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install Pillow mido python-rtmidi

      - name: Download JieLi Toolchain
        run: |
          chmod +x tools/get_toolchain.sh
          tools/get_toolchain.sh "$HOME/.jieli"

      - name: Clone JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Build MORPHEUS Firmware
        run: |
          echo "=== Debug Info ==="
          ls -la "$HOME/.jieli" || true
          ls -la "$HOME/.jieli/toolchain" || true
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          chmod +x build.sh
          sh -x ./build.sh 2>&1 | tee firmware-build.log

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build-log
          path: firmware-build.log

      - name: Upload Firmware Binary Package
        uses: actions/upload-artifact@v4
        with:
          name: morpheus-firmware-fwsc
          path: |
            build/morpheus.fwsc
            build/morpheus.bin

  deploy-pages:
    name: Deploy MORPHEUS Web Demo & Firmware to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: [host-test, firmware-build]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Built Firmware
        uses: actions/download-artifact@v4
        with:
          name: morpheus-firmware-fwsc
          path: build-artifacts

      - name: Stage Firmware for Web Installation
        run: |
          mkdir -p web/firmware
          cp build-artifacts/morpheus.fwsc web/firmware/morpheus.fwsc

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
