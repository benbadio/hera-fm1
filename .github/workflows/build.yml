name: Build HERA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-test:
    name: Engine tests and host simulator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang python3-pil

      - name: J-6 engine tests (chord, phrase, sequencer, synth, glue)
        run: |
          set -o pipefail
          CC=clang J6_RENDER=1 sh tests/j6/run_tests.sh 2>&1 | tee engine-tests.log

      - name: HERA host simulator (every page as a PNG, the session as a WAV)
        run: sh tests/run_hera_host.sh

      - name: Upload test logs, screenshots and audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hera-host-test
          path: |
            engine-tests.log
            build/hera/*.png
            build/hera/hera.wav
            build/j6/demo.wav

  firmware-build:
    name: Build HERA .fwsc package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip3 install Pillow

      - name: Download the JieLi toolchain
        run: |
          chmod +x tools/get_toolchain.sh
          tools/get_toolchain.sh "$HOME/.jieli"

      - name: Clone the JieLi AC79 SDK
        run: |
          git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13 \
            https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$HOME/fw-AC79_AIoT_SDK"

      - name: Build HERA
        run: |
          set -eo pipefail
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          chmod +x build.sh
          ./build.sh 2>&1 | tee firmware-build.log
          ls -la build/

      - name: Build summary
        if: always()
        run: |
          echo "### HERA firmware build" >> "$GITHUB_STEP_SUMMARY"
          if [ -f firmware-build.log ]; then
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 firmware-build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hera-firmware-build-log
          path: firmware-build.log

      - name: Upload the firmware package
        uses: actions/upload-artifact@v4
        with:
          name: hera-firmware
          path: |
            build/hera.fwsc
            build/hera.bin
            build/hera.dis
          if-no-files-found: error

  workbench:
    name: Build the HERA Workbench (browser)
    runs-on: ubuntu-latest
    needs: firmware-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang and lld (wasm32)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld

      - name: Build hera.wasm
        run: WASM_CC=clang sh web/build.sh

      - name: Download the firmware package
        uses: actions/download-artifact@v4
        with:
          name: hera-firmware
          path: build-fw

      - name: Bundle the firmware with the installer page
        run: cp build-fw/hera.fwsc web/firmware/hera.fwsc

      - name: Upload the Workbench
        uses: actions/upload-artifact@v4
        with:
          name: hera-workbench
          path: |
            web
            !web/src
            !web/build.sh
